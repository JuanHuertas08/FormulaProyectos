<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee: #3a1408;
            --dark-orange: #7c2d12;
            --mid-orange: #c2410c;
            --bright-orange: #f97316;
            --light-orange: #fdba74;
            --cream: #fff7ed;
            --text-muted: #92622f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--coffee) 0%, var(--dark-orange) 22%, var(--mid-orange) 45%, var(--bright-orange) 65%, var(--light-orange) 85%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }
        body::before { width: 380px; height: 380px; background: var(--bright-orange); top: -120px; left: -120px; }
        body::after { width: 320px; height: 320px; background: var(--coffee); bottom: -100px; right: -100px; }

        .login-container {
            background-color: #ffffff;
            padding: 44px 40px 36px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(58, 20, 8, 0.35);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .icon-circle {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--coffee), var(--mid-orange));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px -6px rgba(124, 45, 18, 0.6);
        }
        .icon-circle svg { width: 30px; height: 30px; }
        h2 { color: var(--coffee); margin: 0 0 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 1.2rem; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 22px; }
        .footer-links { margin-top: 10px; text-align: center; border-top: 1px solid #f1e2d3; padding-top: 15px; }
        .footer-links a { color: var(--dark-orange); text-decoration: none; font-weight: 700; font-size: 0.9em; }
        .footer-links a:hover { color: var(--coffee); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>
            </svg>
        </div>
        <h2>Correo Enviado</h2>
        <p>Te hemos enviado instrucciones para restablecer tu contraseña, si existe una cuenta con ese correo. Revisa tu bandeja de entrada (y la carpeta de spam).</p>
        <div class="footer-links">
            <a href="{% url 'login' %}">&larr; Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
