{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Contraseña Actualizada" %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee: #3a1408;
            --dark-orange: #7c2d12;
            --mid-orange: #c2410c;
            --bright-orange: #f97316;
            --light-orange: #fdba74;
            --cream: #fff7ed;
            --text-muted: #92622f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--coffee) 0%, var(--dark-orange) 22%, var(--mid-orange) 45%, var(--bright-orange) 65%, var(--light-orange) 85%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }
        body::before { width: 380px; height: 380px; background: var(--bright-orange); top: -120px; left: -120px; }
        body::after { width: 320px; height: 320px; background: var(--coffee); bottom: -100px; right: -100px; }

        .login-container {
            background-color: #ffffff;
            padding: 44px 40px 36px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(58, 20, 8, 0.35);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .icon-circle {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--coffee), var(--mid-orange));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px -6px rgba(124, 45, 18, 0.6);
        }
        .icon-circle svg { width: 30px; height: 30px; }
        h2 { color: var(--coffee); margin: 0 0 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 1.2rem; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 26px; }
        a.button-link {
            display: inline-block; width: 100%; box-sizing: border-box;
            background: linear-gradient(135deg, var(--dark-orange), var(--mid-orange));
            color: white; padding: 14px 20px; border-radius: 10px;
            font-size: 16px; font-weight: 700; text-decoration: none;
            transition: filter 0.3s;
        }
        a.button-link:hover { filter: brightness(1.08); }

        .lang-switcher {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        .lang-switcher button {
            all: unset;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            transition: background 0.2s, color 0.2s;
        }

        .lang-switcher button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .lang-switcher button.active {
            background: #fff;
            color: var(--coffee);
        }
    </style>
</head>
<body>
    <form action="{% url 'set_language' %}" method="post" class="lang-switcher">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.path }}">
        <button type="submit" name="language" value="es" class="{% if LANGUAGE_CODE == 'es' %}active{% endif %}">ES</button>
        <button type="submit" name="language" value="en" class="{% if LANGUAGE_CODE == 'en' %}active{% endif %}">EN</button>
    </form>

    <div class="login-container">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
        </div>
        <h2>{% trans "¡Contraseña Actualizada!" %}</h2>
        <p>{% trans "Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tus nuevos datos." %}</p>
        <a href="{% url 'login' %}" class="button-link">{% trans "Iniciar Sesión" %}</a>
    </div>
</body>
</html>
