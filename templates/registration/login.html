<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Paleta de colores: 
           Naranja Mate: #D35400 o #E67E22
           Fondo Oscuro/Sobrio: #2C3E50
           Blanco elegante: #ECF0F1
        */
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e67e22; /* Naranja Mate Principal */
            background: linear-gradient(135deg, #d35400 0%, #e67e22 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Estilos para el formulario de Django {{ form.as_p }} */
        form p {
            text-align: left;
            margin-bottom: 20px;
            color: #7f8c8d;
        }

        input[type="text"], 
        input[type="password"], 
        input[type="email"],
        form input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            display: inline-block;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Importante para el diseño responsivo */
            transition: border-color 0.3s;
            background-color: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #d35400;
            background-color: #fff;
        }

        button {
            width: 100%;
            background-color: #2c3e50; /* Azul oscuro para contraste elegante */
            color: white;
            padding: 14px 20px;
            margin: 20px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1a252f;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            color: #d35400;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #2c3e50;
            text-decoration: underline;
        }

        /* Ajustes para móviles muy pequeños */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>

        <div class="footer-links" style="margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
    <p style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 10px;">
        ¿Aún no tienes una cuenta?
    </p>
    <a href="{% url 'register' %}" class="register-link" 
       style="color: #d35400; text-decoration: none; font-weight: bold; font-size: 1em; transition: 0.3s;">
       Crear cuenta nueva
    </a>
</div>

        <a href="{% url 'password_reset' %}" class="forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

</body>
</html>
