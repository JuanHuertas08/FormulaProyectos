<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee: #3a1408;
            --dark-orange: #7c2d12;
            --mid-orange: #c2410c;
            --bright-orange: #f97316;
            --light-orange: #fdba74;
            --cream: #fff7ed;
            --text-muted: #92622f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--coffee) 0%, var(--dark-orange) 22%, var(--mid-orange) 45%, var(--bright-orange) 65%, var(--light-orange) 85%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            width: 380px;
            height: 380px;
            background: var(--bright-orange);
            top: -120px;
            left: -120px;
        }

        body::after {
            width: 320px;
            height: 320px;
            background: var(--coffee);
            bottom: -100px;
            right: -100px;
        }

        .login-container {
            background-color: #ffffff;
            padding: 44px 40px 36px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(58, 20, 8, 0.35);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--coffee), var(--mid-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px -6px rgba(124, 45, 18, 0.6);
        }

        h2 {
            color: var(--coffee);
            margin: 0 0 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.3rem;
        }

        form p {
            text-align: left;
            margin-bottom: 18px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        form input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 6px;
            display: inline-block;
            border: 1.5px solid #f1e2d3;
            border-radius: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fdf8f3;
            font-family: inherit;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--mid-orange);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.12);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--dark-orange), var(--mid-orange));
            color: white;
            padding: 14px 20px;
            margin: 22px 0 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: filter 0.3s, transform 0.15s;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(1px);
        }

        .forgot-password {
            display: block;
            margin-top: 16px;
            color: var(--dark-orange);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: var(--coffee);
            text-decoration: underline;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .messages li {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.9em;
            text-align: left;
        }

        .messages li.success {
            background-color: #dcfce7;
            color: #166534;
        }

        .messages li.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid #f1e2d3;
            padding-top: 15px;
        }

        .footer-links p {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .register-link {
            color: var(--dark-orange);
            text-decoration: none;
            font-weight: 700;
            font-size: 1em;
            transition: color 0.3s;
        }

        .register-link:hover {
            color: var(--coffee);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-mark">FP</div>
        <h2>Login</h2>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>

        <div class="footer-links">
            <p>¿Aún no tienes una cuenta?</p>
            <a href="{% url 'register' %}" class="register-link">Crear cuenta nueva</a>
        </div>

        <a href="{% url 'password_reset' %}" class="forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

</body>
</html>
