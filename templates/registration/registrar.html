{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Registro" %} | {% trans "Sistema" %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'usuarios/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee: #3a1408;
            --dark-orange: #7c2d12;
            --mid-orange: #c2410c;
            --bright-orange: #f97316;
            --light-orange: #fdba74;
            --cream: #fff7ed;
            --text-muted: #92622f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--coffee) 0%, var(--dark-orange) 22%, var(--mid-orange) 45%, var(--bright-orange) 65%, var(--light-orange) 85%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            width: 380px;
            height: 380px;
            background: var(--bright-orange);
            top: -120px;
            left: -120px;
        }

        body::after {
            width: 320px;
            height: 320px;
            background: var(--coffee);
            bottom: -100px;
            right: -100px;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(58, 20, 8, 0.35);
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 1;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--coffee), var(--mid-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px -6px rgba(124, 45, 18, 0.6);
        }

        h2 {
            color: var(--coffee);
            text-align: center;
            margin: 0 0 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        form p {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        input {
            margin-top: 6px;
            padding: 11px 14px;
            border: 1.5px solid #f1e2d3;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fdf8f3;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--mid-orange);
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.12);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--dark-orange), var(--mid-orange));
            color: white;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: filter 0.3s, transform 0.15s;
        }

        button:hover { filter: brightness(1.08); }
        button:active { transform: translateY(1px); }

        .footer-links { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .footer-links a { color: var(--dark-orange); text-decoration: none; font-weight: 700; }
        .footer-links a:hover { color: var(--coffee); }

        .errorlist { color: #b91c1c; list-style: none; padding: 0; font-size: 0.8rem; margin-bottom: 10px; }

        /* Validación en vivo del nombre de usuario */
        .estado-usuario { margin-top: 6px; font-size: 0.8rem; font-weight: 600; min-height: 1em; }
        .estado-usuario.ok { color: #047857; }
        .estado-usuario.error { color: #b91c1c; }
        .estado-usuario.cargando { color: var(--text-muted); font-weight: 400; }
        input.campo-ok { border-color: #10b981; }
        input.campo-error { border-color: #dc2626; background-color: #fef2f2; }

        /* Campo de contraseña con botón para mostrar/ocultar */
        .campo-clave { position: relative; display: flex; flex-direction: column; }
        .campo-clave input { padding-right: 46px; }
        .campo-clave .ver-clave {
            all: unset;
            position: absolute;
            right: 8px;
            bottom: 6px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .campo-clave .ver-clave:hover { color: var(--dark-orange); background: rgba(194, 65, 12, 0.08); }
        .campo-clave .ver-clave:focus-visible { outline: 2px solid var(--mid-orange); outline-offset: 1px; }

        .lang-switcher {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        .lang-switcher button {
            all: unset;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            transition: background 0.2s, color 0.2s;
        }

        .lang-switcher button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .lang-switcher button.active {
            background: #fff;
            color: var(--coffee);
        }
    </style>
</head>
<body>
    <form action="{% url 'set_language' %}" method="post" class="lang-switcher">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.path }}">
        <button type="submit" name="language" value="es" class="{% if LANGUAGE_CODE == 'es' %}active{% endif %}">ES</button>
        <button type="submit" name="language" value="en" class="{% if LANGUAGE_CODE == 'en' %}active{% endif %}">EN</button>
    </form>

    <div class="register-card">
        <div class="brand-mark">
            <svg viewBox="0 0 120 120" width="34" height="34" role="img" aria-label="InvestProject">
                <circle cx="60" cy="60" r="34" fill="none" stroke="#fff7ed" stroke-width="6.5" opacity="0.85"/>
                <rect x="56.5" y="19" width="7" height="11" rx="2" fill="#fff7ed"/>
                <polygon points="90,30 64.95,64.95 55.05,55.05" fill="#fdba74"/>
                <polygon points="30,90 64.95,64.95 55.05,55.05" fill="#fff7ed"/>
                <circle cx="60" cy="60" r="6.5" fill="#3a1408" stroke="#fff7ed" stroke-width="2.4"/>
            </svg>
        </div>
        <h2>{% trans "Crear Nueva Cuenta" %}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% trans "Finalizar Registro" %}</button>
        </form>
        <div class="footer-links">
            {% trans "¿Ya tienes una cuenta?" %} <a href="{% url 'login' %}">{% trans "Inicia sesión" %}</a>
        </div>
    </div>

<script>
    const TEXTOS = {
        verificando: "{% trans 'Verificando disponibilidad...' %}",
        disponible: "{% trans 'Nombre de usuario disponible.' %}",
        noVerificado: "{% trans 'No se pudo verificar el nombre de usuario en este momento.' %}",
        mostrar: "{% trans 'Mostrar contraseña' %}",
        ocultar: "{% trans 'Ocultar contraseña' %}"
    };

    // --- Validación del nombre de usuario al salir del campo ---
    const usuarioInput = document.querySelector('[name="username"]');
    if (usuarioInput) {
        const estado = document.createElement('div');
        estado.className = 'estado-usuario';
        estado.setAttribute('aria-live', 'polite');
        estado.id = 'estado-usuario';
        usuarioInput.setAttribute('aria-describedby', 'estado-usuario');
        usuarioInput.insertAdjacentElement('afterend', estado);

        let ultimoValidado = null;
        let consulta = null;
        const marcar = (clase, texto) => {
            estado.className = `estado-usuario ${clase}`;
            estado.textContent = texto;
            usuarioInput.classList.toggle('campo-ok', clase === 'ok');
            usuarioInput.classList.toggle('campo-error', clase === 'error');
            usuarioInput.setAttribute('aria-invalid', clase === 'error' ? 'true' : 'false');
        };

        const validarUsuario = () => {
            const valor = usuarioInput.value.trim();
            if (valor === ultimoValidado) return;
            ultimoValidado = valor;
            if (consulta) consulta.abort();
            consulta = new AbortController();
            marcar('cargando', TEXTOS.verificando);
            fetch(`{% url 'validar_usuario' %}?username=${encodeURIComponent(valor)}`, { signal: consulta.signal })
                .then(resp => resp.json())
                .then(data => marcar(data.disponible ? 'ok' : 'error', data.disponible ? `✓ ${data.mensaje}` : data.mensaje))
                .catch(err => { if (err.name !== 'AbortError') marcar('cargando', TEXTOS.noVerificado); });
        };

        usuarioInput.addEventListener('blur', validarUsuario);
        // Al volver a escribir se limpia el resultado anterior
        usuarioInput.addEventListener('input', () => {
            ultimoValidado = null;
            marcar('', '');
        });
    }

    // --- Ícono del ojo para mostrar/ocultar las contraseñas ---
    const OJO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const OJO_TACHADO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.4 18.4 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

    document.querySelectorAll('input[type="password"]').forEach(input => {
        const envoltura = document.createElement('div');
        envoltura.className = 'campo-clave';
        input.parentNode.insertBefore(envoltura, input);
        envoltura.appendChild(input);

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'ver-clave';
        boton.innerHTML = OJO;
        boton.setAttribute('aria-label', TEXTOS.mostrar);
        boton.setAttribute('aria-pressed', 'false');
        boton.addEventListener('click', () => {
            const visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            boton.innerHTML = visible ? OJO_TACHADO : OJO;
            boton.setAttribute('aria-label', visible ? TEXTOS.ocultar : TEXTOS.mostrar);
            boton.setAttribute('aria-pressed', String(visible));
            input.focus();
        });
        envoltura.appendChild(boton);
    });
</script>
</body>
</html>
