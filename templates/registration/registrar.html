<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sistema</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #d35400 0%, #e67e22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px; /* Más ancho para dos columnas si fuera necesario */
        }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; text-transform: uppercase; font-size: 1.5rem; }
        
        /* Estilo para los campos del formulario Django */
        form p {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            color: #34495e;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            transition: 0.3s;
        }
        input:focus { border-color: #d35400; outline: none; box-shadow: 0 0 5px rgba(211, 84, 0, 0.2); }

        button {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background-color: #1a252f; }
        
        .footer-links { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .footer-links a { color: #d35400; text-decoration: none; font-weight: bold; }
        
        /* Errores de validación */
        .errorlist { color: #e74c3c; list-style: none; padding: 0; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Crear Nueva Cuenta</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Finalizar Registro</button>
        </form>
        <div class="footer-links">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
