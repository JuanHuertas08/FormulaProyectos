<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee: #3a1408;
            --dark-orange: #7c2d12;
            --mid-orange: #c2410c;
            --bright-orange: #f97316;
            --light-orange: #fdba74;
            --cream: #fff7ed;
            --text-muted: #92622f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--coffee) 0%, var(--dark-orange) 22%, var(--mid-orange) 45%, var(--bright-orange) 65%, var(--light-orange) 85%, var(--cream) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            width: 380px;
            height: 380px;
            background: var(--bright-orange);
            top: -120px;
            left: -120px;
        }

        body::after {
            width: 320px;
            height: 320px;
            background: var(--coffee);
            bottom: -100px;
            right: -100px;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(58, 20, 8, 0.35);
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 1;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--coffee), var(--mid-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px -6px rgba(124, 45, 18, 0.6);
        }

        h2 {
            color: var(--coffee);
            text-align: center;
            margin: 0 0 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        form p {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        input {
            margin-top: 6px;
            padding: 11px 14px;
            border: 1.5px solid #f1e2d3;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fdf8f3;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--mid-orange);
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.12);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--dark-orange), var(--mid-orange));
            color: white;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: filter 0.3s, transform 0.15s;
        }

        button:hover { filter: brightness(1.08); }
        button:active { transform: translateY(1px); }

        .footer-links { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .footer-links a { color: var(--dark-orange); text-decoration: none; font-weight: 700; }
        .footer-links a:hover { color: var(--coffee); }

        .errorlist { color: #b91c1c; list-style: none; padding: 0; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="brand-mark">FP</div>
        <h2>Crear Nueva Cuenta</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Finalizar Registro</button>
        </form>
        <div class="footer-links">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
